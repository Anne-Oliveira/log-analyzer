# Regras de detecção do log-analyzer.
# Tudo aqui é opcional: o que você não escrever usa o valor padrão.
# Use aspas simples nas regexes (assim as barras invertidas ficam literais).

general:
  max_evidence: 10          # máximo de linhas originais anexadas a cada achado

# Falhas de login repetidas (SSH, ou apps que registram o evento "login_failed").
# Login bem-sucedido logo após as falhas eleva o achado para "critical".
auth_brute_force:
  enabled: true
  threshold: 5              # nº de falhas do mesmo IP ...
  window_seconds: 300       # ... dentro desta janela de tempo
  high_count: 20            # a partir deste total a severidade sobe para "high"
  events: [ssh_failed_login, login_failed]
  success_events: [ssh_accepted_login]

# Varredura web: muitos erros do mesmo IP em pouco tempo.
web_scanner:
  enabled: true
  threshold: 5
  window_seconds: 60
  high_count: 30
  status_codes: [400, 403, 404]

# Falhas repetidas de autenticação HTTP em caminhos de login.
http_auth_failures:
  enabled: true
  threshold: 10
  window_seconds: 300
  high_count: 50
  status_codes: [401]
  login_paths: [/login, /signin, /auth, /admin, /wp-login.php, /xmlrpc.php]

# Requisições com caminhos de ataque ou user-agents de scanners (sem janela de tempo).
suspicious_request:
  enabled: true
  min_hits: 3               # nº mínimo de requisições suspeitas do mesmo IP
  high_count: 10
  path_patterns:
    - '\.\./'
    - '/etc/(passwd|shadow)'
    - '/\.env\b'
    - '/\.git(/|$)'
    - 'wp-login\.php|wp-admin|xmlrpc\.php'
    - 'phpmyadmin'
    - 'union\s+select|<script|sleep\(\d+\)|or\s+1=1'
    - 'cgi-bin|vendor/phpunit|/actuator|/\.aws|/\.ssh'
  user_agent_patterns:
    - nmap
    - sqlmap
    - nikto
    - masscan
    - wpscan
    - dirbuster
    - gobuster
    - nuclei
    - zgrab

# Uso suspeito do sudo.
sudo:
  enabled: true
  min_failed_attempts: 3    # soma de tentativas com senha errada, por usuário
  sensitive_commands:
    - '(^|/)(ba|z|da)?sh(\s|$)'
    - 'chmod\s+(-\w+\s+)*[0-7]*777|chmod\s+\S*\+s'
    - '\b(useradd|adduser|usermod|userdel|passwd)\b'
    - '/etc/(sudoers|shadow|passwd)|visudo'
    - '(curl|wget)\s.*\|\s*(ba)?sh'
    - '\b(nc|ncat|netcat)\s'